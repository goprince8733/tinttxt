# =============================================================================
# server-headers.conf —— TintTXT 网页版 TXT 听书器 · nginx 部署示例
#
# 用法：include 进目标 server{} 块：
#   server {
#       listen 443 ssl;
#       http2 on;                       # nginx >= 1.25.1；旧版写 listen 443 ssl http2;
#       server_name  tts.example.com;
#       root /var/www/tinttxt;          # scripts/build.mjs 产出的 dist/ 内容
#       include /etc/nginx/conf.d/tinttxt-headers.conf;   # ← 本文件
#   }
#
# ⚠️ nginx 关键陷阱（本文件已规避）：
#   add_header 指令在某层级一旦出现，父层级的 add_header 全部不再继承。
#   因此本文件把「安全/隔离头」只放在 server 级别，location 里一律用
#   expires 指令控制缓存（expires 不影响 add_header 继承）。
#   如果你必须在 location 里写 add_header，请把 server 级别的 5 条安全头
#   原样复制进该 location，否则 COOP/COEP 会丢失，多线程 TTS 直接不可用。
#
# 【为什么需要 COOP/COEP】
#   Piper TTS（onnxruntime-web）多线程推理需要 SharedArrayBuffer，浏览器要求：
#     Cross-Origin-Opener-Policy: same-origin
#     Cross-Origin-Embedder-Policy: credentialless（= 隔离可用 + 放行百度统计等跨域资源；
#                                    旧浏览器不识别该值 → 不隔离 → piper 降级单线程）
#   页面用 window.crossOriginIsolated 检测；为 false 时 UI 应降级提示
#   （tts/piper-runtime.js 已自动把 numThreads 降为 1，功能可用但合成变慢）。
#   降级提示写在 UI 层即可，例如：
#     「当前未启用隔离环境，语音合成为单线程模式」
#
# 【HTTPS 硬要求】Service Worker / MediaSession / Wake Lock 仅在
#   HTTPS 或 localhost 可用；80 端口强制 301 跳 443（见第 2 节）。
# =============================================================================

# ---------------------------------------------------------------------------
# 1) 安全与隔离头（server 级别，所有响应继承，含 404/500 错误页）
# ---------------------------------------------------------------------------
add_header Cross-Origin-Opener-Policy      "same-origin"   always;
# credentialless（≠ require-corp）：放行不带 CORP 的跨域资源（如百度统计 hm.js/信标），
# 同时保持 crossOriginIsolated=true；旧浏览器不识别该值 → 不隔离 → piper 降级单线程。
add_header Cross-Origin-Embedder-Policy    "credentialless"  always;
add_header Cross-Origin-Resource-Policy    "same-origin"   always;
# 权限策略：只收敛本应用用不到的能力；本应用不采集麦克风/摄像头，
# 不要在此禁用与音频播放相关的任何项。
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), payment=(), usb=(), autoplay=(self)" always;
add_header X-Content-Type-Options "nosniff"    always;
# 跨域只发送来源域名（不含书页路径），兼顾百度统计可用性与阅读内容隐私
add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
add_header X-Frame-Options       "SAMEORIGIN"  always;

# ---------------------------------------------------------------------------
# 2) HTTPS 强制 + HTTP/2（放在 80/443 的 server 块里）
# ---------------------------------------------------------------------------
# server {
#     listen 80;
#     server_name tts.example.com;
#     return 301 https://$host$request_uri;
# }
# server {
#     listen 443 ssl;
#     http2 on;                          # 旧 nginx：listen 443 ssl http2;
#     ssl_certificate     /etc/letsencrypt/live/tts.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/tts.example.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ...
# }

# ---------------------------------------------------------------------------
# 3) MIME（关键几项；缺失会导致 wasm/onnx/webmanifest 被浏览器拒绝）
#    放在 http{} 或 server{} 块均可（同一层级只能有一个 types 块）。
# ---------------------------------------------------------------------------
types {
    text/html                             html htm;
    text/css                              css;
    text/plain                            txt md;
    text/xml                              xml;
    application/javascript                js mjs;
    application/manifest+json             webmanifest;
    application/json                      json map;
    image/png                             png;
    image/jpeg                            jpg jpeg;
    image/gif                             gif;
    image/webp                            webp;
    image/svg+xml                         svg;
    image/x-icon                          ico;
    audio/wav                             wav;
    audio/mpeg                            mp3;
    audio/mp4                             m4a;
    audio/ogg                             ogg;
    application/wasm                      wasm;    # ← 关键：流式编译要求此类型
    application/octet-stream              onnx data bin;
}

# ---------------------------------------------------------------------------
# 4) 压缩：千万不要 gzip wasm / onnx
#    - application/wasm：浏览器要求以正确 Content-Encoding 流式编译，
#      nginx 对 wasm 的 gzip 处理历来有坑，且 10MB+ 压缩 CPU 开销大于收益；
#    - onnx（20–63MB 二进制）：压缩收益极低，直接不压，靠长缓存 + HTTP/2；
#    - 若启用 brotli（ngx_brotli），同样不要把 application/wasm、
#      application/octet-stream 加入 brotli_types。
# ---------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;
# 明确不压缩的类型（默认就不压，写出来防后人误加）：
#   application/wasm、application/octet-stream（onnx/data）

# ---------------------------------------------------------------------------
# 5) 缓存策略（location 内只用 expires，避免破坏第 1 节的 add_header 继承）
#    与 sw.js 的策略互补：HTTP 缓存 → 下次更快；SW 缓存 → 断网可用。
#    ⚠️ 本节是**裸 location 指令**，没有 server{} 包裹——因为本文件整体
#    就是设计为 include 进你的 server{} 块（见文件头用法）。nginx 不允许
#    在 server{} 内再嵌套 server{}，多包一层会导致 nginx -t 直接失败。
# ---------------------------------------------------------------------------

    # 5.1 应用壳：HTML 不缓存（保证 SW / 资源更新即时生效）
    location = /index.html {
        expires -1;                      # → Cache-Control: no-cache
        try_files $uri =404;
    }

    # 5.2 源码与样式（文件名无内容哈希 → 短缓存 + 协商缓存）
    location ~* ^/(src|styles)/.*\.(js|mjs|css)$ {
        expires 5m;                      # → Cache-Control: max-age=300
        try_files $uri =404;
    }

    # 5.3 图标与 manifest
    location ~* ^/icons/.*\.(png|svg|ico|webp)$ {
        expires 7d;                      # → Cache-Control: max-age=604800
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }

    # 5.4 大文件：TTS 模型（20–121MB）与运行时（wasm/data 约 10–18MB）
    #     - 长缓存 30 天；
    #     - Range：nginx 原生支持，无需额外模块；<audio> 拖动、断点续传、
    #       浏览器分片缓存都依赖它（Content-Length/ETag/Last-Modified 默认开）；
    #     - 不要对本目录开 slice/mp4 之类的模块，也不要压缩。
    location ~* ^/(models|tts)/ {
        expires 30d;                     # → Cache-Control: max-age=2592000
        try_files $uri =404;
        access_log off;                  # 大文件不写访问日志（可选）
        # 如需显式 immutable，必须在此重复第 1 节全部安全头，例如：
        # add_header Cache-Control "public, max-age=2592000, immutable" always;
        # add_header Cross-Origin-Opener-Policy   "same-origin" always;
        # add_header Cross-Origin-Embedder-Policy "credentialless" always;
        # add_header Cross-Origin-Resource-Policy "same-origin" always;
        # add_header Permissions-Policy "..." always;
        # add_header X-Content-Type-Options "nosniff" always;
    }

    # 5.5 其余同源资源 + SPA fallback（无扩展名路径回 index.html）
    location / {
        expires 5m;
        try_files $uri $uri/ /index.html;
    }

    # 5.6 关闭不需要的探测
    location = /favicon.ico { expires 7d; try_files /icons/favicon.ico =404; }
    location ~ /\. { deny all; }          # 隐藏 .git/.env 等

# ---------------------------------------------------------------------------
# 6) 部署自检清单
# ---------------------------------------------------------------------------
#  curl -I https://tts.example.com/                 → 含 COOP/COEP（always 生效）
#  curl -I https://tts.example.com/manifest.webmanifest
#  curl -I -H 'Range: bytes=0-99' https://tts.example.com/models/zh_CN-huayan-medium.onnx
#      → HTTP 206 + Content-Range（Range 可用）
#  页面 DevTools Console：
#      crossOriginIsolated                          → true（多线程 TTS 可用）
#      navigator.serviceWorker.getRegistration()    → 存在（安全上下文）
#  断网刷新 → 应用壳可打开（SW 为渐进增强；华为浏览器「添加到桌面」
#      若只生成网址快捷方式，SW 可能不生效 —— 属预期，核心功能不依赖 SW）
